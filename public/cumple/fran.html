<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Fran</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; display: flex; justify-content: center; align-items: center; }
        .slide img { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.35; filter: blur(2px); }
        .mensaje { font-size: 3.5rem; text-align: center; padding: 0 20px; text-shadow: 0 4px 15px rgba(0,0,0,1); z-index: 1; font-weight: bold; }
        .dorado { color: #eab308; font-size: 6rem; text-transform: uppercase; }
        .animar { animation: fadeInOut 5s ease-in-out forwards; }
        .animar-final { animation: fadeIn 3s ease-in-out forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: scale(1.05); } 20% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }
        @keyframes fadeIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="slide1" class="slide"><img src="img/grupo1.jpg" alt="Fútbol"><div class="mensaje">Para Fran...</div></div>
    <div id="slide2" class="slide"><img src="img/grupo2.jpg" alt="Cena"><div class="mensaje">Gracias por apoyarme siempre...</div></div>
    <div id="slide3" class="slide"><img src="img/fran.jpg" alt="Bandera"><div class="mensaje">...y darme tanto cariño.</div></div>
    <div id="slide4" class="slide"><div class="mensaje"><span class="dorado">¡Felicidades<br>Fran!</span></div></div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        setTimeout(() => document.getElementById('slide1').classList.add('animar'), 500);
        setTimeout(() => document.getElementById('slide2').classList.add('animar'), 5500);
        setTimeout(() => document.getElementById('slide3').classList.add('animar'), 10500);
        setTimeout(() => { document.getElementById('slide4').classList.add('animar-final'); lanzarConfeti(); }, 15500);
        function lanzarConfeti() {
            var duration = 5 * 1000; var animationEnd = Date.now() + duration; var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }
            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) return clearInterval(interval);
              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
