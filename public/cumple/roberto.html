    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #1e293b; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .slide { position: absolute; width: 100%; height: 100%; opacity: 0; display: flex; justify-content: center; align-items: center; }
        .slide img { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.4; filter: blur(2px); }
        .mensaje { font-size: 3rem; text-align: center; padding: 0 40px; text-shadow: 0 4px 15px rgba(0,0,0,1); z-index: 1; font-weight: bold; line-height: 1.3; }
        .dorado { color: #facc15; font-size: 5rem; text-transform: uppercase; text-shadow: 0 0 20px rgba(250,204,21,0.6); }
        .animar { animation: fadeInOut 3.5s ease-in-out forwards; }
        .animar-final { animation: fadeIn 3s ease-in-out forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: scale(1.05); } 15% { opacity: 1; transform: scale(1); } 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.95); } }
        @keyframes fadeIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        #startBtn { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; cursor: pointer; color: white; font-size: 2rem; font-weight: bold; transition: opacity 0.5s; text-align: center; padding: 0 20px; }
        #startBtn span { font-size: 1.2rem; color: #94a3b8; margin-top: 15px; font-weight: normal; }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '10', width: '10',
                videoId: '7MAiqCAhEyw', // Clair de lune
                playerVars: { 'autoplay': 0, 'controls': 0, 'playsinline': 1 },
                events: { 'onReady': function() {} }
            });
        }
        document.getElementById('startBtn').addEventListener('click', function() {
            this.style.opacity = '0';
            setTimeout(() => this.style.display = 'none', 500);
            if (player && typeof player.playVideo === 'function') { player.playVideo(); }

            var timePerSlide = 3000;
            
            for(let i=1; i<=33; i++) {
                setTimeout(() => {
                    let s = document.getElementById('slide' + i);
                    if(s) s.classList.add('animar');
                }, 500 + (i-1)*timePerSlide);
            }
            
            setTimeout(() => { 
                let s = document.getElementById('slide34');
                if(s) s.classList.add('animar-final'); 
                lanzarConfeti(); 
            }, 500 + 33*timePerSlide);
        });

        function lanzarConfeti() {
            var duration = 8 * 1000; var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0, colors: ['#facc15', '#60a5fa', '#ffffff'] };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }
            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) return clearInterval(interval);
              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
